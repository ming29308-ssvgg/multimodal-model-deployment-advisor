[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-model-selector-agent"
version = "0.1.0"
description = "A LangGraph demo that detects deployment hardware and recommends models for multimodal tasks."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "langgraph>=1.0,<2.0",
    "psutil>=6.0,<8.0",
    "pydantic>=2.9,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend" = ["static/*.html", "static/*.css", "static/*.js"]
"backend.agents.model_selector" = ["models*.json"]

